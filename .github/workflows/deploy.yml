name: Build and Deploy Frontend (Expo Web)

on:
  push:
    branches: [ "main" ]   # IMPORTANT: main, not master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔎 Check IP
        run: curl https://api.ipify.org
      ###################################
      # Checkout Code
      ###################################
      - name: Checkout repository
        uses: actions/checkout@v4

      ###################################
      # Setup Node.js
      ###################################
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      ###################################
      # Install Dependencies
      ###################################
      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit --omit=optional

      ###################################
      # Build Expo Web
      ###################################
      - name: Build Expo Web App
        env:
          EXPO_PUBLIC_API_BASE: https://platformaapp.ru
        run: |
          npx expo export --platform web --clear

      ###################################
      # Deploy dist folder via SCP (SSH key pair)
      ###################################
      - name: Upload dist via scp
        shell: bash
        run: |
          set -e
      
          echo "[INFO] Writing SSH key"
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/github_deploy
          chmod 600 ~/.ssh/github_deploy
      
          echo "[INFO] Copying files"
          scp -o StrictHostKeyChecking=no \
              -i ~/.ssh/github_deploy \
              -r dist/* \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/dist/
