name: Build and Deploy Frontend (Expo Web)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  # Refresh HTML/sitemap for newly published content without a code change.
  schedule:
    - cron: '0 3 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔎 Check IP
        run: curl https://api.ipify.org
      ###################################
      # Checkout Code
      ###################################
      - name: Checkout repository
        uses: actions/checkout@v4

      ###################################
      # Setup Node.js
      ###################################
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      ###################################
      # Install Dependencies
      ###################################
      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit --omit=optional

      ###################################
      # Build Expo Web
      ###################################
      - name: Build Expo Web App
        env:
          EXPO_PUBLIC_API_BASE: https://platformaapp.ru
        run: |
          npx expo export --platform web --clear

      ###################################
      # Generate public HTML and a sitemap from the same content snapshot.
      ###################################
      - name: Generate sitemap.xml
        env:
          EXPO_PUBLIC_API_BASE: https://platformaapp.ru
        run: |
          node scripts/generate-public-pages.js dist
          node scripts/generate-sitemap.js dist
          python3 scripts/verify-sitemap.py dist/sitemap.xml

      ###################################
      # Deploy dist folder via SCP (SSH key pair)
      ###################################
      - name: Upload dist via scp
        shell: bash
        env:
          # Must match the host directory mounted into platforma_frontend.
          FRONTEND_DEPLOY_PATH: ${{ vars.FRONTEND_DEPLOY_PATH || '/opt/frontend/dist' }}
        run: |
          set -euo pipefail
          if [[ ! "$FRONTEND_DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+/dist$ ]]; then
            echo "FRONTEND_DEPLOY_PATH must be an absolute path ending in /dist"
            exit 1
          fi
      
          echo "[INFO] Writing SSH key"
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/github_deploy
          chmod 600 ~/.ssh/github_deploy
      
          # Refuse to create an unrelated directory while nginx serves another one.
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/github_deploy \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "test -d '$FRONTEND_DEPLOY_PATH'"

          echo "[INFO] Copying files to the nginx-mounted dist directory"
          scp -o StrictHostKeyChecking=no \
              -i ~/.ssh/github_deploy \
              -r dist/. \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"$FRONTEND_DEPLOY_PATH/"

      - name: Verify published sitemap is XML
        run: python3 scripts/verify-sitemap.py https://platformaapp.ru/sitemap.xml --expect-file dist/sitemap.xml --allow-additional

      - name: Verify article, event and mentor HTML without JavaScript
        run: node scripts/verify-public-pages.js dist https://platformaapp.ru
